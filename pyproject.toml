[project]
name = "apg223-rag"
version = "0.6.0"
description = "Hybrid Parent-Child and Neo4j Graph RAG pipeline for APRA Prudential Practice Guide APG 223"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.11.20",
    "fpdf2>=2.9.0",
    "google-genai>=1.0.0",
    "langchain-text-splitters>=0.3.0",
    "neo4j>=5.28.0",
    "numpy>=2.0.0",
    "pinecone>=6.0.0",
    "pydantic>=2.0.0",
    "pymupdf>=1.25.0",
    "python-dotenv>=1.0.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "truststore>=0.10.5",
]

[project.scripts]
apg223-ingest = "apg223_rag.cli:ingest_main"
apg223-query = "apg223_rag.cli:query_main"
apg223-benchmark = "apg223_rag.benchmark:run_benchmark"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
